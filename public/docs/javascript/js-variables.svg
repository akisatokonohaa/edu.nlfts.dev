<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Variabel dan Tipe Data JavaScript</title><desc id="desc">Ilustrasi deklarasi variabel dan tipe data JavaScript.</desc>
