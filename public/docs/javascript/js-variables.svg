  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#172235" stroke="#334155" stroke-width="2"/>
  <g font-family="monospace" font-size="26"><text x="125" y="215" fill="#c084fc">const</text><text x="215" y="215" fill="#60a5fa">name</text><text x="295" y="215" fill="#cbd5e1">=</text><text x="325" y="215" fill="#fbbf24">"JavaScript"</text><text x="125" y="275" fill="#c084fc">let</text><text x="180" y="275" fill="#60a5fa">active</text><text x="278" y="275" fill="#cbd5e1">=</text><text x="308" y="275" fill="#4ade80">true</text></g>
