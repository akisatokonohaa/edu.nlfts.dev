  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#172235" stroke="#334155" stroke-width="2"/>
  <g font-family="monospace" font-size="27"><text x="125" y="210" fill="#c084fc">console</text><text x="250" y="210" fill="#cbd5e1">.</text><text x="267" y="210" fill="#60a5fa">log</text><text x="325" y="210" fill="#cbd5e1">(</text><text x="344" y="210" fill="#fbbf24">"Hello, JavaScript!"</text><text x="620" y="210" fill="#cbd5e1">);</text></g>
