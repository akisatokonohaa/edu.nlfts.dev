<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operator JavaScript</title><desc id="desc">Simbol operator aritmatika dan logika pada JavaScript.</desc>
  <rect width="1200" height="630" rx="36" fill="#101827"/><circle cx="1050" cy="70" r="250" fill="#fb923c" opacity=".13"/>
  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#172235" stroke="#334155" stroke-width="2"/>
  <g fill="#fdba74" font-family="monospace" font-size="72" font-weight="700"><text x="155" y="300">+</text><text x="310" y="300">===</text><text x="555" y="300">&amp;&amp;</text><text x="810" y="300">...</text></g>
  <text x="120" y="430" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Operator JavaScript</text><text x="120" y="478" fill="#94a3b8" font-family="Arial,sans-serif" font-size="24">Aritmatika, logika, perbandingan, dan lainnya</text>
</svg>
