<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Belajar PHP</title>
  <desc id="description">Ilustrasi kode PHP dengan logo PHP dan elemen pemrograman.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a36"/>
      <stop offset="1" stop-color="#243b70"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c7ff"/>
      <stop offset="1" stop-color="#6d91e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="250" fill="#4668b5" opacity=".16"/>
  <circle cx="120" cy="590" r="240" fill="#7899e9" opacity=".12"/>
  <g fill="#d9e5ff" opacity=".28">
    <circle cx="104" cy="98" r="5"/>
    <circle cx="136" cy="98" r="5"/>
    <circle cx="168" cy="98" r="5"/>
  </g>
  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#111a31" stroke="#7899e9" stroke-opacity=".3" stroke-width="2"/>
  <rect x="72" y="72" width="1056" height="58" rx="28" fill="#1c2949"/>
  <path d="M72 102h1056v28H72z" fill="#1c2949"/>
  <g fill="#8fa9e8" font-family="monospace" font-size="23">
    <text x="122" y="205">&lt;?php</text>
    <text x="122" y="262" fill="#b9c9f2">$learning =</text>
    <text x="300" y="262" fill="#a9c7ff">"PHP";</text>
    <text x="122" y="319" fill="#b9c9f2">echo</text>
    <text x="190" y="319" fill="#a9c7ff">"Build something great";</text>
    <text x="122" y="376">?&gt;</text>
  </g>
  <g transform="translate(690 188)">
    <ellipse cx="190" cy="106" rx="190" ry="106" fill="url(#orb)"/>
    <text x="190" y="132" text-anchor="middle" fill="#263b70" font-family="Arial, sans-serif" font-size="83" font-weight="700">php</text>
  </g>
  <text x="690" y="408" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Belajar PHP</text>
  <text x="690" y="454" fill="#b9c9f2" font-family="Arial, sans-serif" font-size="22">Dari dasar hingga OOP modern</text>
</svg>
