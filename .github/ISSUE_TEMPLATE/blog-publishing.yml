name: "Permohonan Menerbitkan Blog ke EDU"
description: "Ajukan blog Anda untuk diterbitkan di platform EDU."
title: "[Permohonan Blog] "

labels:
  - "blog"
  - "pending-review"

assignees:
  - "davingm"

body:
  - type: markdown
    attributes:
      value: |
        Silakan isi formulir berikut untuk mengajukan blog Anda ke platform EDU.

        Pastikan seluruh informasi yang diberikan benar dan dapat diverifikasi. Blog yang tidak dapat diakses atau tidak memenuhi persyaratan dapat ditolak.

  - type: input
    id: blog_title
    attributes:
      label: "Judul Blog"
      description: "Masukkan judul blog yang diajukan."
      placeholder: "Contoh: Cara Menggunakan Resend di Nuxt.js"
    validations:
      required: true

  - type: input
    id: blog_url
    attributes:
      label: "Alamat Blog"
      description: "Masukkan URL blog yang dapat diakses secara publik."
      placeholder: "https://example.com"
    validations:
      required: true

  - type: checkboxes
    id: blog_categories
    attributes:
      label: "Kategori Blog"
      description: "Pilih satu atau lebih kategori yang sesuai."
      options:
        - label: "Teknologi"
        - label: "Pribadi"
        - label: "Developer"
        - label: "Tips dan Trik"
        - label: "Tutorial"
        - label: "Lainnya"
    validations:
      required: true

  - type: input
    id: blog_category_other
    attributes:
      label: "Kategori Lainnya"
      description: "Isi jika memilih kategori Lainnya."
      placeholder: "Contoh: Keuangan"

  - type: textarea
    id: blog_description
    attributes:
      label: "Deskripsi Blog"
      description: "Jelaskan secara singkat isi dan fokus blog Anda."
      placeholder: "Tuliskan ringkasan blog yang diajukan."
    validations:
      required: true

  - type: textarea
    id: blog_notes
    attributes:
      label: "Catatan Tambahan"
      description: "Opsional."
      placeholder: "Informasi tambahan yang ingin disampaikan."

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Konfirmasi"
      description: "Centang seluruh pernyataan berikut."
      options:
        - label: "Saya telah membaca dan memahami kriteria publikasi yang berlaku."
        - label: "Saya memahami lisensi CC BY-NC yang digunakan oleh EDU."
        - label: "Saya menyatakan bahwa informasi yang diberikan adalah benar."
    validations:
      required: true
